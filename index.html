<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Monetag -->
<script src='//libtl.com/sdk.js' data-zone='10857063' data-sdk='show_10857063'></script>

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Ads Open Neon</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#050816;
  color:white;
  position:relative;
}

/* =========================
   CYBER NEON BACKGROUND
========================= */

body::before{
  content:'';
  position:absolute;
  width:200%;
  height:200%;
  background:
  radial-gradient(circle,#00ffff22 10%,transparent 20%),
  radial-gradient(circle,#ff00ff22 10%,transparent 20%),
  radial-gradient(circle,#00ff8822 10%,transparent 20%);
  background-size:300px 300px;
  animation:moveBg 20s linear infinite;
  z-index:0;
}

body::after{
  content:'';
  position:absolute;
  inset:0;
  background-image:
  linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px);
  background-size:40px 40px;
  animation:gridMove 10s linear infinite;
  z-index:0;
}

.neon-circle{
  position:absolute;
  border-radius:50%;
  filter:blur(40px);
  opacity:0.5;
  animation:float 10s infinite ease-in-out;
}

.c1{
  width:250px;
  height:250px;
  background:#00ffff;
  top:10%;
  left:5%;
}

.c2{
  width:200px;
  height:200px;
  background:#ff00ff;
  bottom:10%;
  right:10%;
}

.c3{
  width:180px;
  height:180px;
  background:#00ff88;
  top:50%;
  left:50%;
}

/* Analog Clock */

.clock{
  position:absolute;
  top:20px;
  width:150px;
  height:150px;
  border:5px solid rgba(255,255,255,0.2);
  border-radius:50%;
  backdrop-filter:blur(10px);
  background:rgba(255,255,255,0.05);
  z-index:5;
  box-shadow:0 0 30px rgba(0,255,255,0.3);
}

/* Clock Numbers */

.number{
  position:absolute;
  color:white;
  font-size:16px;
  font-weight:bold;
  text-shadow:0 0 10px #00ffff;
}

.n1{top:12px; right:38px;}
.n2{top:35px; right:12px;}
.n3{top:58px; right:5px;}
.n4{bottom:35px; right:12px;}
.n5{bottom:12px; right:38px;}
.n6{bottom:5px; left:50%; transform:translateX(-50%);}
.n7{bottom:12px; left:38px;}
.n8{bottom:35px; left:12px;}
.n9{top:58px; left:5px;}
.n10{top:35px; left:8px;}
.n11{top:12px; left:32px;}
.n12{
  top:2px;
  left:50%;
  transform:translateX(-50%);
}

/* Center Dot */

.center-dot{
  position:absolute;
  width:12px;
  height:12px;
  background:#00ffff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 15px #00ffff;
}

/* Clock Hands */

.hand{
  position:absolute;
  width:50%;
  height:4px;
  background:white;
  top:50%;
  left:50%;
  transform-origin:left center;
  border-radius:10px;
}
.hour{
  width:35%;
  height:5px;
}

.minute{
  width:45%;
  height:3px;
}

.second{
  width:48%;
  height:2px;
  background:#00ffff;
}

/* Main Box */

.box{
  width:360px;
  padding:25px;
  border-radius:25px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  z-index:2;
  position:relative;
  box-shadow:0 0 40px rgba(0,255,255,0.2);
}

/* Display */

.display{
  background:#020617;
  border-radius:20px;
  padding:20px;
  border:2px solid #00ffff;
  box-shadow:0 0 20px rgba(0,255,255,0.4);
}

.title{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#00ffff;
  margin-bottom:15px;
  text-shadow:0 0 15px #00ffff;
}

.item{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  font-size:18px;
  border:1px solid rgba(255,255,255,0.08);
}

/* Button */

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:15px;
  background:linear-gradient(90deg,#00ffff,#0066ff);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px rgba(0,255,255,0.3);
}

button:hover{
  transform:scale(1.03);
}

/* Background Animations */

@keyframes moveBg{
  0%{
    transform:translate(0,0);
  }
  50%{
    transform:translate(-10%,-10%);
  }
  100%{
    transform:translate(0,0);
  }
}

@keyframes gridMove{
  0%{
    background-position:0 0;
  }
  100%{
    background-position:40px 40px;
  }
}

@keyframes float{
  0%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-20px);
  }
  100%{
    transform:translateY(0px);
  }
}

</style>
</head>

<body>

<!-- Neon Background -->
<div class="neon-circle c1"></div>
<div class="neon-circle c2"></div>
<div class="neon-circle c3"></div>

<!-- Analog Clock -->
<div class="clock">

  <div class="number n1">1</div>
  <div class="number n2">2</div>
  <div class="number n3">3</div>
  <div class="number n4">4</div>
  <div class="number n5">5</div>
  <div class="number n6">6</div>
  <div class="number n7">7</div>
  <div class="number n8">8</div>
  <div class="number n9">9</div>
  <div class="number n10">10</div>
  <div class="number n11">11</div>
  <div class="number n12">12</div>

  <div class="center-dot"></div>

  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>

</div>

<!-- Main Card -->
<div class="box">

  <div class="display">

    <div class="title">⚡ LEION</div>

    <div class="item">
      👤 Name:
      <span id="name">Loading...</span>
    </div>

    <div class="item">
      📩 Username:
      <span id="username">Loading...</span>
    </div>

    <div class="item">
      📺 Ads Click:
      <span id="ads">0</span>
    </div>

    <div class="item">
      💰 Points:
      <span id="points">0</span>
    </div>

  </div>

  <button onclick="watchAd()">🚀 Watch Ad</button>

</div>

<script>

/* Telegram */

let tg = window.Telegram.WebApp;
tg.expand();

/* User Info */

if (tg.initDataUnsafe && tg.initDataUnsafe.user){

  document.getElementById("name").innerText =
    tg.initDataUnsafe.user.first_name;

  document.getElementById("username").innerText =
    '@' + (tg.initDataUnsafe.user.username || 'NoUsername');

}else{

  document.getElementById("name").innerText = "Telegram Only";
  document.getElementById("username").innerText = "Not Found";

}

/* Ads System */

let ads = 0;
let points = 0;

function updateDisplay(){

  document.getElementById("ads").innerText = ads;
  document.getElementById("points").innerText = points;

}

function watchAd() {
  if (typeof show_10857063 === 'function') {
    show_10857063().then(() => {
      ads++;
      points++;
      update();
    }).catch(() => alert("Ad failed ❌"));
  } else {
    alert("SDK not loaded ❌");
  }
}

  }else{

    alert("Monetag SDK Not Loaded ❌");

  }

}

updateDisplay();

/* Analog Clock */

function updateClock(){

  const now = new Date();

  const sec = now.getSeconds();
  const min = now.getMinutes();
  const hour = now.getHours();

  const secDeg = sec * 6 - 90;
  const minDeg = min * 6 - 90;
  const hourDeg = hour * 30 + min / 2 - 90;

  document.getElementById("second").style.transform =
    `rotate(${secDeg}deg)`;

  document.getElementById("minute").style.transform =
    `rotate(${minDeg}deg)`;

  document.getElementById("hour").style.transform =
    `rotate(${hourDeg}deg)`;

}

setInterval(updateClock,1000);

updateClock();

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
